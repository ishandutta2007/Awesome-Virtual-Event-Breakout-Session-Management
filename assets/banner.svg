<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(14px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
      }

      .floating-node-1 {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatRight 7s ease-in-out infinite;
      }
      .pulse-sphere {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 10, 10;
        animation: dashMove 4s linear infinite;
      }
      .interactive-wave {
        animation: waveFloat 8s ease-in-out infinite alternate;
      }
      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .sub-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Ambient Dynamic Glow Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" class="pulse-sphere" filter="url(#softGlow)"/>
  <circle cx="1020" cy="260" r="160" fill="#a855f7" class="pulse-sphere" style="animation-delay: -2.5s;" filter="url(#softGlow)"/>
  <circle cx="850" cy="70" r="100" fill="#ec4899" class="pulse-sphere" style="animation-delay: -1.2s;" filter="url(#softGlow)"/>

  <!-- Dynamic Connecting Wave Lines (Signifying Breakout Networks) -->
  <g class="interactive-wave" opacity="0.35">
    <path d="M -50 180 Q 250 80 550 200 T 1250 160" fill="none" stroke="#6366f1" stroke-width="2.5" class="flowing-line"/>
    <path d="M -50 230 Q 300 320 650 170 T 1250 240" fill="none" stroke="#a855f7" stroke-width="2" class="flowing-line" style="animation-duration: 6s;"/>
    <path d="M -50 130 Q 400 60 750 220 T 1250 110" fill="none" stroke="#ec4899" stroke-width="1.8" class="flowing-line" style="animation-duration: 5s;"/>
  </g>

  <!-- Background Dynamic Breakout Session Pod Cards (Left side) -->
  <g class="floating-node-1" transform="translate(60, 45)" opacity="0.85">
    <!-- Pod 1 -->
    <rect width="180" height="74" rx="12" fill="#131c31" stroke="#334155" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="26" r="8" fill="#10b981"/>
    <text x="40" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Breakout Room A</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">👥 18 Participants • Active</text>
  </g>

  <g class="floating-node-2" transform="translate(50, 235)" opacity="0.85">
    <!-- Pod 2 -->
    <rect width="190" height="74" rx="12" fill="#131c31" stroke="#334155" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="26" r="8" fill="#6366f1"/>
    <text x="40" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Workshop Stage B</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">🎙️ Live Audio/Video Stream</text>
  </g>

  <!-- Background Dynamic Breakout Session Pod Cards (Right side) -->
  <g class="floating-node-2" transform="translate(950, 45)" opacity="0.85">
    <!-- Pod 3 -->
    <rect width="190" height="74" rx="12" fill="#131c31" stroke="#334155" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="26" r="8" fill="#f59e0b"/>
    <text x="40" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Collaborative Lab C</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">⚡ Interactive Whiteboard</text>
  </g>

  <g class="floating-node-1" transform="translate(960, 235)" opacity="0.85">
    <!-- Pod 4 -->
    <rect width="180" height="74" rx="12" fill="#131c31" stroke="#334155" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="26" r="8" fill="#ec4899"/>
    <text x="40" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Networking Hub D</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">💬 Fluid Social Lounge</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Protected high-contrast area) -->
  <g transform="translate(600, 180)">
    <!-- Protective Foreground Aura -->
    <ellipse cx="0" cy="0" rx="350" ry="120" fill="#090d16" opacity="0.75" filter="url(#softGlow)"/>

    <!-- Category Pill Tag -->
    <g transform="translate(-140, -96)">
      <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="5" fill="#22c55e" class="pulse-sphere"/>
      <text x="32" y="20.5" fill="#c7d2fe" class="badge-label">CURATED DIRECTORY &amp; ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-22" text-anchor="middle" fill="url(#textGrad)" class="main-title" font-size="44" filter="url(#glow)">
      Virtual Event &amp; Breakout Sessions
    </text>

    <!-- Animated Accent Line Under Title -->
    <rect x="-180" y="-6" width="360" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="32" text-anchor="middle" fill="#94a3b8" class="sub-title" font-size="18">
      Top SaaS Platforms &amp; Self-Hosted Open-Source WebRTC Engines
    </text>

    <!-- Mini Feature Highlights Pill Bar -->
    <g transform="translate(-270, 62)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="82.5" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🏢 Enterprise SaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="90" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🔓 Self-Hosted WebRTC</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="82.5" y="18" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🔀 Breakout Rooms</text>
      </g>
    </g>
  </g>
</svg>
